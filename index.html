<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adataviz</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Les vélocistes de Nantes Métropole</h1>
      <p>Retrouvez les professionnels du vélo près de chez vous.</p>
    </header>

    <main>
      <section>
        <h2>Rechercher un vélociste</h2>
        <!--Recherche et filtre par nom-->
        <div class="filtres">
          <div class="filtre">
            <label for="recherche-velociste">Nom du vélociste </label>
            <input
              type="search"
              id="recherche-velociste"
              placeholder="Ex. ECOX"
            />
          </div>
          <!-- Recherche et filtre par commune -->
          <div class="filtre">
            <label for="liste-commune">Filtrer par commune</label>
            <select name="commune" id="liste-commune">
              <option value="">Toutes les communes</option>
            </select>
          </div>

        </div>

      </section>

      <section>
        <p id="compteur">Chargement des vélocistes...</p>
        <div id="liste-velocistes"></div>
      </section>
    </main>
  </body>
  <footer>
    <p>&copy; 2026 Bounsy Sisouk</p>
  </footer>
</html>
